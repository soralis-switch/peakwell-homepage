<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>お問い合わせ | 株式会社ピークウェル</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="animations.css">
    <style>
        body { font-family: 'BIZ UDPGothic', sans-serif; color: #333; }
        h1, h2, h3, h4 { font-weight: 700; }
        tailwind.config = {
            theme: {
                extend: {
                    colors: { 'light-blue': '#f0f9ff' }
                }
            }
        }
    </style>
</head>
<body class="bg-white">

    <!-- ヘッダー -->
    <header class="bg-white sticky top-0 z-50 shadow-md">
        <div class="container mx-auto px-6 py-4 flex justify-between items-center">
            <a href="index.html" class="flex items-center"><img src="assets/images/logo.png" alt="PEAKWELL Logo" class="h-10"></a>
            <nav class="hidden md:flex space-x-6 items-center text-sm">
                <a href="business.html" class="text-gray-600 hover:text-sky-500">事業内容</a>
                <a href="company.html" class="text-gray-600 hover:text-sky-500">会社概要</a>
                <a href="message.html" class="text-gray-600 hover:text-sky-500">代表者挨拶</a>
                <a href="news.html" class="text-gray-600 hover:text-sky-500">ニュース</a>
                <a href="recruit.html" class="text-gray-600 hover:text-sky-500">採用情報</a>
                <a href="index.html#contact" class="bg-sky-500 text-white font-bold py-2 px-6 rounded-full hover:bg-sky-600">お問い合わせ</a>
                </nav>
            <div class="md:hidden"><button class="text-gray-600"><svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg></button></div>
        </div>
    </header>

    <main>
        <!-- パンくずリスト -->
        <div class="bg-light-blue"><div class="container mx-auto px-6 py-2 text-sm text-gray-500"><a href="index.html" class="hover:text-sky-500">ホーム</a><span class="mx-2">></span><span>お問い合わせ</span></div></div>

        <!-- ページヘッダー -->
        <section class="bg-light-blue pt-6 pb-12">
            <div class="container mx-auto px-6 text-center">
                <h1 class="text-3xl md:text-4xl font-bold text-gray-800">CONTACT</h1>
                <p class="text-sky-500 mt-2 font-bold">お問い合わせフォーム</p>
            </div>
        </section>

        <!-- メインコンテンツ -->
        <section class="py-12 md:py-20">
            <div class="container mx-auto px-6 max-w-2xl">
                <div class="bg-white p-8 rounded-lg shadow-lg border">
                    <div class="text-center mb-8">
                        <p class="text-gray-600 leading-relaxed">事業に関するご相談、協業のご提案など、お気軽にお問い合わせください。<br>担当者より、3営業日以内にご返信いたします。</p>
                    </div>
                    <form action="ここにあなたの【お問い合わせ用】のFormspree URLを貼り付けます" method="POST">
                        <div class="space-y-6">
                            <div>
                                <label for="company-name" class="block text-sm font-bold text-gray-700 mb-1">会社名</label>
                                <input type="text" id="company-name" name="会社名" autocomplete="organization" class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-sky-500 focus:border-sky-500">
                            </div>
                            <div>
                                <label for="name" class="block text-sm font-bold text-gray-700 mb-1">ご担当者名 <span class="text-red-500">*</span></label>
                                <input type="text" id="name" name="担当者名" required autocomplete="name" class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-sky-500 focus:border-sky-500">
                            </div>
                            <div>
                                <label for="email" class="block text-sm font-bold text-gray-700 mb-1">メールアドレス <span class="text-red-500">*</span></label>
                                <input type="email" id="email" name="メールアドレス" required autocomplete="email" class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-sky-500 focus:border-sky-500">
                            </div>
                            <div>
                                <label for="message" class="block text-sm font-bold text-gray-700 mb-1">お問い合わせ内容 <span class="text-red-500">*</span></label>
                                <textarea id="message" name="お問い合わせ内容" required rows="8" class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-sky-500 focus:border-sky-500"></textarea>
                            </div>
                        </div>
                        <div class="mt-8 text-center">
                            <button type="submit" class="bg-sky-500 text-white font-bold text-lg py-3 px-12 rounded-full hover:bg-sky-600 transition duration-300">送信内容を確認する</button>
                        </div>
                    </form>
                </div>
            </div>
        </section>
    </main>

    <!-- フッター -->
    <footer class="bg-gray-800 text-white"><div class="container mx-auto px-6 py-12"><div class="grid grid-cols-2 md:grid-cols-5 gap-8"><div><h4 class="font-bold mb-4">事業内容</h4><ul class="space-y-2 text-sm text-gray-300"><li><a href="business.html" class="hover:text-sky-500">事業一覧</a></li></ul></div><div><h4 class="font-bold mb-4">会社情報</h4><ul class="space-y-2 text-sm text-gray-300"><li><a href="company.html" class="hover:text-sky-500">会社概要</a></li><li><a href="message.html" class="hover:text-sky-500">代表者挨拶</a></li></ul></div><div><h4 class="font-bold mb-4">ニュース</h4><ul class="space-y-2 text-sm text-gray-300"><li><a href="news.html" class="hover:text-sky-500">ニュース一覧</a></li></ul></div><div><h4 class="font-bold mb-4">採用情報</h4><ul class="space-y-2 text-sm text-gray-300"><li><a href="recruit.html" class="hover:text-sky-500">採用情報</a></li></ul></div><div><h4 class="font-bold mb-4">お問い合わせ</h4><ul class="space-y-2 text-sm text-gray-300"><li><a href="contact.html" class="hover:text-sky-500">お問い合わせフォーム</a></li></ul></div></div><div class="mt-12 pt-8 border-t border-gray-700 flex flex-col md:flex-row justify-between items-center"><a href="index.html" class="flex items-center mb-4 md:mb-0"><img src="assets/images/logo.png" alt="PEAKWELL Logo" class="h-8 mr-3"><span class="text-xl font-bold">株式会社ピークウェル</span></a><p class="text-gray-400 text-sm">© 2024 PEAKWELL Inc. All Rights Reserved.</p></div></div></footer>
</body>
</html>
